<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Пиццерия</title>
    <link rel="stylesheet" href="assets/styles/style.css">
</head>
<body>
<div class="left">
    <div class="pizza-options">
        <div class="pizza-option" data-type="Пепперони">
            <img src="assets/img/pepperoni.jpg" alt="Пепперони">
            <div>Пепперони</div>
        </div>
        <div class="pizza-option" data-type="Маргарита">
            <img src="assets/img/margarita.jpg" alt="Маргарита">
            <div>Маргарита</div>
        </div>
        <div class="pizza-option" data-type="Баварская">
            <img src="assets/img/bavarian.jpg" alt="Баварская">
            <div>Баварская</div>
        </div>
    </div>
</div>
<div class="right">
    <h3>Выберите размер</h3>
    <div class="size-toggle">
        <input type="radio" name="size" id="small" value="маленькая" checked hidden>
        <label for="small">Маленькая</label>
        <input type="radio" name="size" id="large" value="большая" hidden>
        <label for="large">Большая</label>
    </div>
    <h3>Добавить по вкусу</h3>
    <div class="addons">
        <div class="addon" data-name="Сырный борт">
            <img src="assets/img/cheese-crust.jpg" alt="Сырный борт">
            <div>Сырный борт</div>
        </div>
        <div class="addon" data-name="Сливочная моцарелла">
            <img src="assets/img/mozzarella.jpg" alt="Сливочная моцарелла">
            <div>Сливочная моцарелла</div>
        </div>
        <div class="addon" data-name="Чедер и пармезан">
            <img src="assets/img/cheddar-parmesan.jpg" alt="Чедер и пармезан">
            <div>Чедер и пармезан</div>
        </div>
    </div>
    <button class="cart-button" id="cartButton">Добавить в корзину за 0₽ (0 Ккал)</button>
</div>
<script src="pizza.js"></script>
</body>
</html>
